<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0c" />
  <title>Serlzo Investments — Reset access</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="assets/css/premium-pages.css"/>
</head>
<body>
  <main class="page-wrap" style="display:flex;align-items:center;justify-content:center;padding:24px 16px">
    <section class="card card-pad" style="width:min(100%,440px)">
      <a href="index.html" class="brand-mark" style="font-size:1.4rem"><span class="brand-dot"></span>Serlzo Investments</a>
      <h1 style="margin-top:28px">Reset your access</h1>
      <p style="margin-top:9px;color:var(--muted);font-size:.86rem;line-height:1.6">Enter the email linked to your Serlzo Investments account and we’ll send you a secure reset link.</p>
      <div id="alert" class="alert" style="margin-top:18px"></div>
      <form id="resetForm" style="margin-top:18px">
        <div class="field"><label class="field-label" for="email">Email address</label><input class="field-input" id="email" type="email" placeholder="you@example.com" autocomplete="email" required /></div>
        <button class="btn btn-primary" type="submit" id="resetBtn">Send reset link</button>
      </form>
      <a href="index.html" class="btn btn-ghost" style="width:100%;margin-top:10px">Return to sign in</a>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="assets/js/serlzo.js" defer></script>
  <script src="assets/js/supabase.js" defer></script>
  <script src="assets/js/icons.js" defer></script>
<script>
      document.addEventListener("DOMContentLoaded", async function () {
        if (window.SerlzoReady) await window.SerlzoReady;
      var form = document.getElementById("resetForm");
      var btn = document.getElementById("resetBtn");
      var alertBox = document.getElementById("alert");
      form.addEventListener("submit", async function (event) {
        event.preventDefault();
        var email = document.getElementById("email").value.trim();
        if (!window.sb) { alertBox.textContent = window.SerlzoConfig?.error || "Serlzo Investments access is not configured yet. Ask the site administrator to set SUPABASE_URL and SUPABASE_ANON_KEY in Vercel."; alertBox.className = "alert alert-warn show"; return; }
        window.SerlzoUI?.setBusy(btn, true, "Sending…");
        var result = await window.sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + "/change-password.html" });
        window.SerlzoUI?.setBusy(btn, false);
        if (result.error) { alertBox.textContent = result.error.message; alertBox.className = "alert alert-error show"; return; }
        alertBox.textContent = "If an account exists for that email, a reset link is on its way.";
        alertBox.className = "alert alert-success show";
      });
    });
  </script>
</body>
</html>
